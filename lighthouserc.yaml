ci:
  collect:
    staticDistDir: ./dist
    url:
      - /
    numberOfRuns: 3
  assert:
    preset: lighthouse:no-pwa
    assertions:
      categories:performance:
        - error
        - minScore: 0.95
      categories:accessibility:
        - error
        - minScore: 1
      categories:best-practices:
        - error
        - minScore: 1
      categories:seo:
        - error
        - minScore: 1
