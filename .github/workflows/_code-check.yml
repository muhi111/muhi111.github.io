name: Code Static Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm check:astro
      - run: pnpm exec biome ci
      - run: pnpm build
