name: Lighthouse CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lighthouse:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
      - run: pnpm build
      - run: pnpm exec lhci autorun
