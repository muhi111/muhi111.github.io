name: Setup pnpm workspace
description: Setup pnpm, Node.js, and install dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: "pnpm"
    - run: pnpm ci
      shell: bash
