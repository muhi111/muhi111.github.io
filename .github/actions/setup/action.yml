name: "Setup Node.js & pnpm"
description: "Sets up Node.js, pnpm, and installs dependencies"
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
